name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Generate and Save Permanent Keystore (If Missing)
      run: |
        if [ ! -f "app/debug.keystore" ]; then
          echo "Generating permanent debug.keystore..."
          keytool -genkey -v -keystore app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=YOJO, OU=App, O=YOJO, L=Sargodha, S=Punjab, C=PK"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/debug.keystore
          git commit -m "Add permanent debug.keystore for fixed SHA keys"
          git push
        else
          echo "Permanent debug.keystore already exists in repo!"
        fi

    - name: Print Permanent SHA-1 and SHA-256 Keys
      run: |
        echo "=========================================="
        echo "   COPY YOUR FIREBASE SHA KEYS BELOW      "
        echo "=========================================="
        keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yojo-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
